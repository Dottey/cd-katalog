<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16150f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CD-Katalog">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<title>CD-Katalog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #cfcabf;
    --window: #f4f2ec;
    --panel: #ffffff;
    --ink: #16150f;
    --ink-muted: #55524a;
    --line: #16150f;
    --line-soft: #a39d8d;
    --accent: #1c3fb7;
    --accent-ink: #ffffff;
    --warn: #a3341f;
    --hairline: #d8d3c4;
    --shadow: rgba(22,21,15,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #05170c; --window: #08170d; --panel: #0b1f11;
      --ink: #cdf5d8; --ink-muted: #6fae83; --line: #4bdc7e;
      --accent: #4bdc7e; --accent-ink: #05170c; --warn: #ff8a70;
      --line-soft: #1f5432; --hairline: #163b23; --shadow: rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #05170c; --window: #08170d; --panel: #0b1f11;
    --ink: #cdf5d8; --ink-muted: #6fae83; --line: #4bdc7e;
    --accent: #4bdc7e; --accent-ink: #05170c; --warn: #ff8a70;
    --line-soft: #1f5432; --hairline: #163b23; --shadow: rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; padding-block: 14px; }
  .pixel { font-family: "Silkscreen", "IBM Plex Mono", monospace; letter-spacing: 0.02em; }
  button, input, select, textarea { font-family: inherit; }

  .win { max-width: 560px; margin: 0 auto 24px auto; padding: 0 14px; }
  .titlebar {
    border: 2px solid var(--line); border-bottom: none; background: var(--panel);
    padding: 7px 10px; display: flex; align-items: center; gap: 10px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  }
  .titlebar .box { width: 11px; height: 11px; border: 1.5px solid var(--line); flex: 0 0 auto; }
  .titlebar .stripes { flex: 1; height: 11px; background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 3px); opacity: 0.55; }
  .titlebar h1 { font-size: 13px; margin: 0; padding: 0 8px; background: var(--panel); white-space: nowrap; }

  .menubar {
    border: 2px solid var(--line); border-top: none; border-bottom: none;
    background: var(--panel); display: flex; overflow-x: auto; scrollbar-width: none;
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 27px); z-index: 29;
  }
  .menubar::-webkit-scrollbar { display: none; }
  .menuitem {
    flex: 0 0 auto; font-family: "Silkscreen", monospace; font-size: 10.5px;
    padding: 8px 11px; border-right: 1px solid var(--hairline); color: var(--ink); white-space: nowrap;
  }
  .menuitem:active { background: var(--accent); color: var(--accent-ink); }

  .toolbar { border: 2px solid var(--line); border-top: none; background: var(--window); padding: 10px 10px 8px 10px; }
  .searchrow { display: flex; gap: 8px; }
  #q { flex: 1; font-size: 15px; padding: 9px 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); outline: none; }
  #q::placeholder { color: var(--ink-muted); }
  #q:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  #clear { display: none; font-size: 13px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 12px; }

  .chiprow { display: flex; gap: 6px; overflow-x: auto; padding: 9px 0 2px 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font-size: 11.5px; padding: 5px 10px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); white-space: nowrap; }
  .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  select#genre { font-size: 11.5px; padding: 5px 8px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); max-width: 42vw; }

  .stats { font-size: 11px; color: var(--ink-muted); padding-top: 8px; border-top: 1px solid var(--hairline); margin-top: 9px; }

  main { border: 2px solid var(--line); border-top: none; background: var(--window); padding: 4px 10px 16px 10px; }

  .sectionhead { font-family: "Silkscreen", monospace; font-size: 12px; margin: 16px 0 6px 0; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
  .sectionhead .n { color: var(--ink-muted); font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }
  .grouphead { font-family: "Silkscreen", monospace; font-size: 11px; color: var(--panel); background: var(--line); padding: 3px 7px; margin: 10px 0 6px 0; display: inline-block; }

  .card { background: var(--panel); border: 1px solid var(--hairline); border-left: 3px solid var(--line-soft); padding: 10px 11px; margin-bottom: 7px; }
  .card.isfav { border-left-color: var(--accent); }
  .card.flash { animation: flashcard 1.6s ease; }
  @keyframes flashcard { 0%,100% { box-shadow: none; } 25%,75% { box-shadow: 0 0 0 2px var(--accent); } }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .cdicon { flex: 0 0 auto; margin-top: 2px; }
  .artist { font-weight: 600; font-size: 14px; line-height: 1.25; }
  .title { font-size: 12.5px; color: var(--ink-muted); margin-top: 1px; }
  .meta { font-size: 10.5px; color: var(--ink-muted); margin-top: 4px; }
  .row2 { display: flex; gap: 9px; align-items: flex-start; }
  .row2 .info { flex: 1; min-width: 0; }
  .pos { font-family: "Silkscreen", monospace; font-size: 9.5px; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); padding: 3px 6px; white-space: nowrap; flex: 0 0 auto; text-align: center; line-height: 1.5; }

  .stars { margin-top: 5px; display: flex; gap: 2px; }
  .stars span { font-size: 15px; color: var(--line-soft); line-height: 1; }
  .stars span.on { color: var(--accent); }
  .stars.readonly { pointer-events: none; }
  .stars.picker span { font-size: 30px; cursor: pointer; padding: 4px; }

  .badge-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .badge { font-size: 10px; border: 1px solid var(--hairline); background: var(--window); padding: 2px 6px; color: var(--ink-muted); }
  .badge.loan { color: var(--warn); border-color: var(--warn); }

  .hit { margin-top: 7px; background: var(--window); border: 1px solid var(--hairline); padding: 6px 8px; font-size: 12.5px; }
  .hit b { color: var(--ink); }
  .hit mark { background: var(--accent); color: var(--accent-ink); padding: 0 2px; }
  .hit .cdlabel { color: var(--ink-muted); font-size: 10px; }

  .tracklist { display: none; margin-top: 8px; border-top: 1px dashed var(--hairline); padding-top: 7px; }
  .tracklist.open { display: block; }
  .disc { margin-bottom: 6px; }
  .disc h4 { font-size: 10px; color: var(--ink-muted); margin: 0 0 3px 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .disc ol { margin: 0; padding-left: 17px; font-size: 12.5px; line-height: 1.55; }
  .disc mark { background: var(--accent); color: var(--accent-ink); padding: 0 2px; }

  .toggle { margin-top: 7px; font-size: 11px; color: var(--accent); display: inline-block; cursor: pointer; }
  .empty { text-align: center; color: var(--ink-muted); padding: 34px 20px; font-size: 13px; }

  .cardactions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; border-top: 1px solid var(--hairline); padding-top: 7px; }
  .mini { font-family: "Silkscreen", monospace; font-size: 9.5px; padding: 5px 8px; border: 1.5px solid var(--line-soft); background: var(--window); color: var(--ink); }
  .mini:active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .mini.danger { color: var(--warn); border-color: var(--warn); }

  .azbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 9px 0 2px 0; border-top: 1px solid var(--hairline); margin-top: 9px; }
  .az { font-family: "Silkscreen", monospace; font-size: 10px; color: var(--ink-muted); background: var(--panel); border: 1.5px solid var(--line-soft); padding: 3px 6px; min-width: 18px; text-align: center; }
  .az.mixjump { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

  /* --- modal --- */
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(10,10,10,0.5); z-index: 50; padding: 22px 16px; overflow-y: auto; }
  .backdrop.open { display: block; }
  .dialog { max-width: 460px; margin: 20px auto; background: var(--panel); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); }
  .dialog .dtitle { font-family: "Silkscreen", monospace; font-size: 12px; padding: 8px 10px; border-bottom: 2px solid var(--line); background: var(--window); display: flex; justify-content: space-between; }
  .dialog .dtitle .xbtn { cursor: pointer; border: 1px solid var(--line); width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; }
  .dialog .dbody { padding: 12px 14px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: var(--ink-muted); margin-bottom: 3px; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field textarea, .field select {
    width: 100%; font-size: 14px; padding: 7px 9px; border: 2px solid var(--line); background: var(--window); color: var(--ink);
  }
  .field textarea { min-height: 64px; resize: vertical; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .checkrow { display: flex; align-items: center; gap: 7px; font-size: 12.5px; margin-bottom: 10px; }
  .checkrow input { width: 16px; height: 16px; }
  .cdblocks { display: flex; flex-direction: column; gap: 8px; }
  .dactions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px 14px 14px; flex-wrap: wrap; }
  .dbtn { font-family: "Silkscreen", monospace; font-size: 11px; padding: 8px 14px; border: 2px solid var(--line); background: var(--window); color: var(--ink); }
  .dbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .dbtn.danger { background: var(--warn); color: #fff; border-color: var(--warn); }
  .dbtn:active { filter: brightness(0.92); }
  .formmsg { font-size: 11.5px; padding: 0 14px 8px 14px; color: var(--ink-muted); }
  .formmsg.err { color: var(--warn); }

  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 12px; }
  .statgrid .stitem { border: 1px solid var(--hairline); padding: 7px 8px; }
  .statgrid .snum { font-family: "Silkscreen", monospace; font-size: 15px; }
  .statgrid .slabel { font-size: 10px; color: var(--ink-muted); }
  .barline { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 3px; }
  .barline .blabel { width: 52px; flex: 0 0 auto; color: var(--ink-muted); }
  .barline .bbar { color: var(--accent); font-family: "Silkscreen", monospace; letter-spacing: -1px; white-space: nowrap; overflow: hidden; }
  .barline .bnum { color: var(--ink-muted); }

  .wl-item { border: 1px solid var(--hairline); padding: 8px 9px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .wl-item .wname { font-weight: 600; font-size: 13px; }
  .wl-item .wtitle { font-size: 12px; color: var(--ink-muted); }
  .wl-item .wnote { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .wl-actions { display: flex; flex-direction: column; gap: 4px; }

  .sticker-wrap { border: 2px solid var(--line); padding: 10px 12px; }
  .sticker-wrap .shead { display: flex; justify-content: space-between; border-bottom: 2px solid var(--line); padding-bottom: 6px; margin-bottom: 6px; }
  .sticker-wrap .sartist { font-weight: 700; font-size: 15px; }
  .sticker-wrap .stitle { font-size: 12px; color: var(--ink-muted); font-style: italic; }
  .sticker-wrap .smeta { font-size: 10px; color: var(--ink-muted); text-align: right; }
  .sticker-wrap .stracks { columns: 2; column-gap: 12px; font-size: 11.5px; line-height: 1.5; }
  .sticker-wrap .sdisc { break-inside: avoid; margin-bottom: 8px; }
  .sticker-wrap .sdisc h5 { font-size: 9.5px; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 3px 0; }
  #toastEl { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px); font-size: 11px; padding: 10px 16px; background: var(--ink); color: var(--panel); border: 2px solid var(--line); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: 88%; text-align: center; }
  #toastEl.show { opacity: 1; transform: translate(-50%, 0); }
  #toastEl.err { background: var(--warn); }
  .sticker-hint { font-size: 10.5px; color: var(--ink-muted); margin-top: 8px; line-height: 1.5; }
  @media print {
    body * { visibility: hidden; }
    .sticker-wrap, .sticker-wrap * { visibility: visible; }
    .sticker-wrap { position: fixed; top: 0; left: 0; width: 100%; padding: 10mm; border: none; }
    .sticker-hint, .backdrop .dtitle, .backdrop .dactions { display: none !important; }
  }
</style>
</head>

</div>

<div class="backdrop" id="backdrop">

</div>

function norm(s){
  if(!s) return '';
  s = s.toString().toLowerCase();
  s = s.replace(/ß/g,'ss');
  s = s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  return s;
}
const ARTICLES = /^(the|die|der|das)\s+/i;
function sortkey(artist){
  let s = (artist||'').trim().replace(ARTICLES,'');
  s = s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  return s.toUpperCase();
}
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function highlight(raw, q){
  raw = raw==null ? '' : String(raw);
  if(!q) return escapeHtml(raw);
  const n = norm(raw);
  const idx = n.indexOf(q);
  if(idx === -1) return escapeHtml(raw);
  return escapeHtml(raw.slice(0,idx)) + '<mark>' + escapeHtml(raw.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(raw.slice(idx+q.length));
}
function normGenreTag(t){
  t = t.trim();
  if(t === 'Synthpop') return 'Synth-Pop';
  if(t === 'Elektronisch') return 'Electronic';
  return t;
}
function genreParts(genre){
  return (genre||'').split('/').map(normGenreTag).filter(Boolean);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d && m && y ? (d+'.'+m+'.'+y) : iso;
}

function buildList(){
  const bakedMerged = BAKED.map(a => {
    const base = {
      id: 'b_'+a.row, row: a.row, fromDb: false,
      artist: a.artist, title: a.title, year: a.year, genre: a.genre, isMix: a.isMix, cds: a.cds,
      rating: a.favorit ? 5 : 0, note: '', loanedTo: null, loanedAt: null, deleted: false, addedAt: null,
    };
    const ov = overridesByRow[a.row];
    if(ov) Object.assign(base, ov);
    return base;
  });
  const combined = bakedMerged.filter(a=>!a.deleted).concat(dbAlbums);
  combined.forEach(a => {
    a._artist = norm(a.artist);
    a._title = norm(a.title);
    a._genre = norm(a.genre);
    a._cds = (a.cds||[]).map(cd => (cd||[]).map(t => ({raw:t, n:norm(t)})));
  });
  const regular = combined.filter(a=>!a.isMix).sort((x,y)=>{
    const kx = sortkey(x.artist), ky = sortkey(y.artist);
    if(kx<ky) return -1; if(kx>ky) return 1;
    return (x.title||'').localeCompare(y.title||'', 'de');
  });
  const mix = combined.filter(a=>a.isMix).sort((x,y)=>{
    const yx = x.year||0, yy = y.year||0;
    if(yx!==yy) return yx-yy;
    return sortkey(x.artist) < sortkey(y.artist) ? -1 : 1;
  });
  regular.forEach((a,i)=>{ a.pos=i+1; a.posTotal=regular.length; a.letter = (sortkey(a.artist)[0]||'#').replace(/[^A-Z]/,'#'); });
  mix.forEach((a,i)=>{ a.pos=i+1; a.posTotal=mix.length; a.group = String(a.year||'?'); });
  return {regular, mix, all: regular.concat(mix)};
}

  genreSelEl.value = genres.includes(cur) ? cur : '';
}

function matchAlbum(a, q){
  let trackHits = [];
  a._cds.forEach((cd,ci)=>{ cd.forEach((t,ti)=>{ if(t.n.includes(q)) trackHits.push({cd:ci, ti, raw:t.raw}); }); });
  const artistHit = a._artist.includes(q);
  const titleHit = a._title.includes(q);
  const genreHit = a._genre.includes(q);
  const score = trackHits.length*3 + (artistHit?2:0) + (titleHit?2:0) + (genreHit?1:0);
  return {hit: trackHits.length||artistHit||titleHit||genreHit, trackHits, score};
}

function wireCard(el, trackHits){
  const toggle = el.querySelector('.toggle');
  const tl = el.querySelector('.tracklist');
  if(trackHits && trackHits.length){ tl.classList.add('open'); toggle.textContent = 'Titelliste ausblenden ▴'; toggle.dataset.open = '1'; }
  toggle.onclick = () => {
    const open = toggle.dataset.open === '1';
    tl.classList.toggle('open', !open);
    toggle.textContent = open ? 'Titelliste anzeigen ▾' : 'Titelliste ausblenden ▴';
    toggle.dataset.open = open ? '0' : '1';
  };
}

function render(){
  const built = buildList();
  CURRENT = built;
  CURRENT_BY_ID = {};
  built.all.forEach(a=>{ CURRENT_BY_ID[a.id] = a; });
  const {regular, mix, all} = built;
  buildGenres(all);

  const nFav = all.filter(a=>a.rating>=4).length;
  const nRated = all.filter(a=>a.rating>0).length;
  const avgRating = nRated ? (all.reduce((s,a)=>s+a.rating,0)/nRated).toFixed(1) : '–';
  document.getElementById('stats').textContent =
    regular.length + ' Alben · ' + mix.length + ' Mix-CDs · ' + all.reduce((s,a)=>s+(a.cds.length||0),0) + ' CDs · ' + nFav + ' Favoriten · Ø ' + avgRating + '★';

  const azbar = document.getElementById('azbar');
  const letters = [...new Set(regular.map(a=>a.letter))].sort();
  azbar.innerHTML = '';
  letters.forEach(L=>{
    const b = document.createElement('div');
    b.className = 'az'; b.textContent = L;
    b.onclick = () => { const el = document.getElementById('L_'+L); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); };
    azbar.appendChild(b);
  });
  const mixJump = document.createElement('div');
  mixJump.className = 'az mixjump'; mixJump.textContent = 'MIX';
  mixJump.onclick = () => { const el = document.getElementById('S_mix'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); };
  azbar.appendChild(mixJump);

  const qraw = qInput.value.trim();
  const q = norm(qraw);
  const genreFilter = genreSelEl.value;
  const results = document.getElementById('results');
  results.innerHTML = '';

  function passFilters(a){
    if(favOnly && !(a.rating>=4)) return false;
    if(newOnly && !a.fromDb) return false;
    if(genreFilter && !genreParts(a.genre).includes(genreFilter)) return false;
    return true;
  }

  function appendCard(a, q, trackHits){
    const div = document.createElement('div');
    div.innerHTML = cardHtml(a, q, trackHits);
    const card = div.firstElementChild;
    wireCard(card, trackHits);
    results.appendChild(card);
  }

  if(newOnly && !q){
    const list = all.filter(passFilters).sort((x,y)=> (y.addedAt||'').localeCompare(x.addedAt||''));
    const sh = document.createElement('div');
    sh.className = 'sectionhead pixel';
    sh.innerHTML = 'NEU HINZUGEFÜGT <span class="n">'+list.length+'</span>';
    results.appendChild(sh);
    if(!list.length){ results.innerHTML += '<div class="empty">Noch keine CDs über die App hinzugefügt.</div>'; return; }
    list.forEach(a=>appendCard(a,'',[]));
    return;
  }

  if(q.length >= 1){
    const matches = all.filter(passFilters).map(a=>{
      const m = matchAlbum(a, q);
      return m.hit ? {a, ...m} : null;
    }).filter(Boolean).sort((x,y)=> y.score - x.score || x.a.pos - y.a.pos);

    if(!matches.length){ results.innerHTML = '<div class="empty">Nichts gefunden. Anderen Begriff versuchen?</div>'; return; }
    matches.forEach(({a, trackHits}) => appendCard(a, q, trackHits));
    return;
  }

  const regFiltered = regular.filter(passFilters);
  const mixFiltered = mix.filter(passFilters);

  if(!regFiltered.length && !mixFiltered.length){ results.innerHTML = '<div class="empty">Nichts gefunden.</div>'; return; }

  if(regFiltered.length){
    const sh = document.createElement('div');
    sh.className = 'sectionhead pixel';
    sh.innerHTML = 'SAMMLUNG A–Z <span class="n">'+regFiltered.length+'</span>';
    results.appendChild(sh);
    let lastLetter = null;
    regFiltered.forEach(a=>{
      if(a.letter !== lastLetter){
        lastLetter = a.letter;
        const h = document.createElement('div');
        h.className = 'grouphead'; h.id = 'L_'+a.letter; h.textContent = a.letter;
        results.appendChild(h);
      }
      appendCard(a, '', []);
    });
  }

  if(mixFiltered.length){
    const sh = document.createElement('div');
    sh.className = 'sectionhead pixel';
    sh.id = 'S_mix';
    sh.innerHTML = 'MIX-CDS &amp; SAMPLER — HINTEN, NACH JAHR <span class="n">'+mixFiltered.length+'</span>';
    results.appendChild(sh);
    let lastGroup = null;
    mixFiltered.forEach(a=>{
      if(a.group !== lastGroup){
        lastGroup = a.group;
        const h = document.createElement('div');
        h.className = 'grouphead'; h.textContent = a.group;
        results.appendChild(h);
      }
      appendCard(a, '', []);
    });
  }
}

render();

/* ---------------- toast (no native alert/confirm/prompt — blocked in the Artifact sandbox) ---------------- */
function toast(msg, isErr){
  let t = document.getElementById('toastEl');
  if(!t){
    t = document.createElement('div');
    t.id = 'toastEl';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.classList.remove('show'); }, 3400);
}
function alertMsg(t){ toast(t, true); }

/* ---------------- card action delegation (edit/loan/sticker/delete/rating) ---------------- */
document.getElementById('results').addEventListener('click', (e) => {
  const btn = e.target.closest('button.mini');
  if(!btn) return;
  const card = e.target.closest('.card');
  const a = CURRENT_BY_ID[card.dataset.id];

  const act = btn.dataset.act;
  if(act === 'rate') openRateModal(a);

});

/** Writes a partial patch to the right place (overrides for baked, direct doc for db-added). */
async function persistPatch(a, patch){
  const db = await claude.use('db');
  if(!db) throw new Error('no db');
  if(a.fromDb){
    await db.collection('newcds').doc(a.id).update(patch);
  } else {
    const current = overridesByRow[a.row] || {};
    const merged = {...current, ...patch};
    await db.collection('overrides').doc('row_'+a.row).set(merged);
  }
}

/* ---------------- db wiring ---------------- */
(async () => {
  let db = null;
  try { db = await claude.use('db'); } catch(e) { db = null; }
  if(!db){ dbAvailable = false; disableWriteFeatures(); return; }
  dbAvailable = true;
  try {
    db.collection('newcds').limit(1000).onSnapshot(snap => {
      dbAlbums = snap.docs.filter(d=>d.exists).map(d => mapNewCd(d.id, d.data())).filter(d=>!d.deleted);
      render();
    }, err => console.warn('newcds snapshot error', err));
    db.collection('overrides').limit(1000).onSnapshot(snap => {
      const map = {};
      snap.docs.forEach(d=>{ if(d.exists){ const row = parseInt(d.id.replace('row_',''),10); map[row] = d.data(); } });
      overridesByRow = map;
      render();
    }, err => console.warn('overrides snapshot error', err));
    db.collection('wishlist').limit(500).onSnapshot(snap => {
      wishlist = snap.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}));
    }, err => console.warn('wishlist snapshot error', err));
  } catch(e) { console.warn(e); }
})();

function openAddEditModal(existing){
  if(dbAvailable === false){ alertMsg('Zum Bearbeiten/Hinzufügen brauchst du kurz Internet.'); return; }
  openModal(existing ? 'CD bearbeiten' : 'Neue CD aufnehmen');

  const genreList = [...new Set(CURRENT.all.map(a=>a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));

  dialogBody.innerHTML =
    '<div class="field-row">' +
      '<div class="field"><label>Interpret *</label><input id="f_artist" type="text"></div>' +
      '<div class="field"><label>Jahr</label><input id="f_year" type="number" min="1900" max="2100"></div>' +
    '</div>' +
    '<div class="field"><label>Album / Titel *</label><input id="f_title" type="text"></div>' +
    '<div class="field"><label>Genre</label><input id="f_genre" type="text" list="genreList"><datalist id="genreList">' +
      genreList.map(g=>'<option value="'+escapeHtml(g)+'">').join('') +
    '</datalist></div>' +
    '<div class="checkrow"><input type="checkbox" id="f_mix"><label>Mix-CD / Sampler (mehrere Interpreten) — kommt ans Ende, sortiert nach Jahr</label></div>' +
    '<div class="field"><label>Bewertung</label><div id="f_rating">'+starsHtml(existing?existing.rating:0, 'picker')+'</div></div>' +
    '<div class="field"><label>Notiz (Zustand etc.)</label><input id="f_note" type="text"></div>' +
    '<div class="field"><label>Anzahl CDs</label><input id="f_count" type="number" min="1" max="6" value="1"></div>' +
    '<div class="cdblocks" id="cdblocks"></div>';

  const countInput = document.getElementById('f_count');
  const cdblocks = document.getElementById('cdblocks');
  function renderCdBlocks(prefill){
    const n = Math.max(1, Math.min(6, parseInt(countInput.value||'1',10)));
    countInput.value = n;
    const existingVals = prefill || [...cdblocks.querySelectorAll('textarea')].map(t=>t.value);
    cdblocks.innerHTML = '';
    for(let i=0;i<n;i++){
      const field = document.createElement('div');
      field.className = 'field';
      const label = n > 1 ? ('CD ' + (i+1) + ' — Titelliste (eine Zeile pro Song)') : 'Titelliste (eine Zeile pro Song)';
      field.innerHTML = '<label>'+label+'</label><textarea data-cd="'+i+'"></textarea>';
      cdblocks.appendChild(field);
      if(existingVals[i]) field.querySelector('textarea').value = existingVals[i];
    }
  }
  countInput.addEventListener('input', () => renderCdBlocks());

  let formRating = existing ? existing.rating : 0;
  dialogBody.querySelector('#f_rating').addEventListener('click', (e)=>{
    const s = e.target.closest('span[data-n]');
    if(!s) return;
    const n = parseInt(s.dataset.n,10);
    formRating = (n === formRating) ? 0 : n;
    dialogBody.querySelector('#f_rating').innerHTML = starsHtml(formRating, 'picker');
  });

  if(existing){
    document.getElementById('f_artist').value = existing.artist||'';
    document.getElementById('f_title').value = existing.title||'';
    document.getElementById('f_year').value = existing.year||'';
    document.getElementById('f_genre').value = existing.genre||'';
    document.getElementById('f_mix').checked = !!existing.isMix;
    document.getElementById('f_note').value = existing.note||'';
    countInput.value = Math.max(1, (existing.cds||[]).length || 1);
    renderCdBlocks((existing.cds||[]).map(cd=>(cd||[]).join('\n')));
  } else {
    renderCdBlocks();
  }

  let forceSave = false;
  const saveBtnLabel = existing ? 'Speichern' : 'Hinzufügen';
  dialogActions.innerHTML = '<button class="dbtn" id="cancelBtn">Abbrechen</button><button class="dbtn primary" id="saveBtn">'+saveBtnLabel+'</button>';
  document.getElementById('cancelBtn').onclick = closeModal;
  const saveBtn = document.getElementById('saveBtn');

  saveBtn.onclick = async () => {
    const artist = document.getElementById('f_artist').value.trim();
    const title = document.getElementById('f_title').value.trim();
    if(!artist || !title){
      formmsg.textContent = 'Interpret und Titel sind Pflichtfelder.'; formmsg.className = 'formmsg err'; return;
    }
    const year = parseInt(document.getElementById('f_year').value||'',10) || null;
    const genre = document.getElementById('f_genre').value.trim();
    const isMix = document.getElementById('f_mix').checked;
    const note = document.getElementById('f_note').value.trim();
    const cds = [...cdblocks.querySelectorAll('textarea')].map(t => t.value.split('\n').map(s=>s.trim()).filter(Boolean));

    if(!forceSave){
      const na = norm(artist), nt = norm(title);
      const dupe = CURRENT.all.find(x => x.id !== (existing&&existing.id) && norm(x.artist)===na && norm(x.title)===nt);
      if(dupe){
        formmsg.textContent = '"'+dupe.artist+' – '+dupe.title+'" gibt es schon in der Sammlung. Nochmal klicken um trotzdem zu speichern.';
        formmsg.className = 'formmsg err';
        forceSave = true;
        saveBtn.textContent = 'Trotzdem speichern';
        return;
      }
    }

    saveBtn.disabled = true; saveBtn.textContent = 'Speichere…';
    formmsg.textContent = ''; formmsg.className = 'formmsg';
    try {
      const db = await claude.use('db');
      if(!db) throw {code:'not_granted'};
      const patch = {artist, title, year, genre, isMix, note, cds, rating: formRating};
      if(existing && existing.fromDb){
        await db.collection('newcds').doc(existing.id).update(patch);
      } else if(existing && !existing.fromDb){
        const current = overridesByRow[existing.row] || {};
        await db.collection('overrides').doc('row_'+existing.row).set({...current, ...patch});
      } else {
        await db.collection('newcds').add({...patch, addedAt: new Date().toISOString()});
      }
      closeModal();
    } catch(e) {
      saveBtn.disabled = false; saveBtn.textContent = saveBtnLabel;
      formmsg.textContent = 'Konnte nicht gespeichert werden (' + (e && e.code || 'Fehler') + '). Bist du online?';
      formmsg.className = 'formmsg err';
    }
  };
}
document.getElementById('m_add').onclick = () => openAddEditModal(null);

/* ---------------- stats ---------------- */
function openStatsModal(){
  const all = CURRENT.all;
  const nAlbums = all.length;
  const nDiscs = all.reduce((s,a)=>s+(a.cds.length||0),0);
  const rated = all.filter(a=>a.rating>0);
  const avg = rated.length ? (rated.reduce((s,a)=>s+a.rating,0)/rated.length).toFixed(2) : '–';
  const years = all.map(a=>a.year).filter(Boolean);
  const minY = years.length ? Math.min(...years) : '–';
  const maxY = years.length ? Math.max(...years) : '–';

  const genreCount = {};
  all.forEach(a => genreParts(a.genre).forEach(g => { genreCount[g] = (genreCount[g]||0)+1; }));
  const topGenre = Object.entries(genreCount).sort((a,b)=>b[1]-a[1])[0];

  const artistCount = {};
  all.forEach(a => { artistCount[a.artist] = (artistCount[a.artist]||0)+1; });
  const topArtist = Object.entries(artistCount).sort((a,b)=>b[1]-a[1])[0];

  const decadeCount = {};
  years.forEach(y => { const d = Math.floor(y/10)*10; decadeCount[d] = (decadeCount[d]||0)+1; });
  const decades = Object.keys(decadeCount).map(Number).sort((a,b)=>a-b);
  const maxDecade = Math.max(1, ...decades.map(d=>decadeCount[d]));

  openModal('Statistik');
  dialogBody.innerHTML =
    '<div class="statgrid">' +
      '<div class="stitem"><div class="snum">'+nAlbums+'</div><div class="slabel">Alben</div></div>' +
      '<div class="stitem"><div class="snum">'+nDiscs+'</div><div class="slabel">CDs gesamt</div></div>' +
      '<div class="stitem"><div class="snum">'+avg+'★</div><div class="slabel">Ø Bewertung ('+rated.length+' bewertet)</div></div>' +
      '<div class="stitem"><div class="snum">'+minY+'–'+maxY+'</div><div class="slabel">Jahresspanne</div></div>' +
      '<div class="stitem"><div class="snum">'+(topGenre?escapeHtml(topGenre[0]):'–')+'</div><div class="slabel">Top-Genre ('+(topGenre?topGenre[1]:0)+')</div></div>' +
      '<div class="stitem"><div class="snum">'+(topArtist?escapeHtml(topArtist[0]):'–')+'</div><div class="slabel">Meiste Alben ('+(topArtist?topArtist[1]:0)+')</div></div>' +
    '</div>' +
    '<div class="pixel" style="font-size:11px; margin-bottom:6px;">JAHRZEHNTE</div>' +
    decades.map(d => {
      const c = decadeCount[d];
      const w = Math.max(1, Math.round((c/maxDecade)*20));
      return '<div class="barline"><div class="blabel">'+d+'er</div><div class="bbar">'+'█'.repeat(w)+'</div><div class="bnum">'+c+'</div></div>';
    }).join('');
  dialogActions.innerHTML = '<button class="dbtn primary" id="statsCloseBtn">Schließen</button>';
  document.getElementById('statsCloseBtn').onclick = closeModal;
}
document.getElementById('m_stats').onclick = openStatsModal;

  render();
  requestAnimationFrame(() => {
    const groupEl = pick.isMix ? document.getElementById('S_mix') : document.getElementById('L_'+pick.letter);
    const card = document.querySelector('.card[data-id="'+pick.id+'"]');
    if(card){
      card.scrollIntoView({behavior:'smooth', block:'center'});
      card.classList.add('flash');
      const toggle = card.querySelector('.toggle');
      if(toggle && toggle.dataset.open === '0') toggle.click();
      setTimeout(()=>card.classList.remove('flash'), 1700);
    }
  });
};

/* ---------------- export ---------------- */
document.getElementById('m_export').onclick = async () => {
  try {
    const downloads = await claude.use('downloads');
    if(!downloads){ alertMsg('Export braucht die Verbindung zu claude.ai (kurz online sein).'); return; }
    const payload = {
      exportedAt: new Date().toISOString(),
      albums: CURRENT.all.map(a => ({
        artist: a.artist, title: a.title, year: a.year, genre: a.genre, isMix: a.isMix,
        rating: a.rating, note: a.note, loanedTo: a.loanedTo, loanedAt: a.loanedAt,
        cds: a.cds, quelle: a.fromDb ? 'app' : 'excel',
      })),
      wishlist: wishlist.map(w => ({artist: w.artist, title: w.title, note: w.note})),
    };
    await downloads.save({filename: 'cd-katalog-export.json', data: JSON.stringify(payload, null, 2)});
  } catch(e) {
    if(e && e.code !== 'declined') alertMsg('Export fehlgeschlagen (' + (e&&e.code||'Fehler') + ').');
  }
};

/* ---------------- wishlist ---------------- */
function openWishlistModal(){
  openModal('Wunschliste');
  function body(){
    if(!wishlist.length) return '<div class="empty">Noch nichts auf der Wunschliste.</div>';
    return wishlist.map(w =>
      '<div class="wl-item" data-id="'+w.id+'">' +
        '<div><div class="wname">'+escapeHtml(w.artist)+'</div><div class="wtitle">'+escapeHtml(w.title)+'</div>' +
        (w.note?'<div class="wnote">'+escapeHtml(w.note)+'</div>':'') + '</div>' +
        '<div class="wl-actions"><button class="mini" data-wact="tocol">→ Sammlung</button><button class="mini danger" data-wact="wdel">✕</button></div>' +
      '</div>'
    ).join('');
  }
  dialogBody.innerHTML =
    '<div class="field-row">' +
      '<div class="field"><label>Interpret</label><input id="w_artist" type="text"></div>' +
      '<div class="field"><label>Album</label><input id="w_title" type="text"></div>' +
    '</div>' +
    '<div class="field"><label>Notiz</label><input id="w_note" type="text" placeholder="z.B. Re-Release, Vinyl-Only bisher …"></div>' +
    '<div class="dbtn primary" id="w_addBtn" style="display:inline-block; margin-bottom:12px;">+ Zur Wunschliste</div>' +
    '<div id="wl_list">' + body() + '</div>';

  dialogActions.innerHTML = '<button class="dbtn" id="wCloseBtn">Schließen</button>';
  document.getElementById('wCloseBtn').onclick = closeModal;

  document.getElementById('w_addBtn').onclick = async () => {
    const artist = document.getElementById('w_artist').value.trim();
    const title = document.getElementById('w_title').value.trim();
    const note = document.getElementById('w_note').value.trim();
    if(!artist || !title){ formmsg.textContent = 'Interpret und Titel angeben.'; formmsg.className='formmsg err'; return; }
    try {
      const db = await claude.use('db');
      if(!db) throw 0;
      await db.collection('wishlist').add({artist, title, note, addedAt: new Date().toISOString()});
      document.getElementById('w_artist').value='';
      document.getElementById('w_title').value='';
      document.getElementById('w_note').value='';
      formmsg.textContent = ''; formmsg.className = 'formmsg';
      setTimeout(()=>{ document.getElementById('wl_list').innerHTML = body(); }, 300);
    } catch(e){ formmsg.textContent = 'Bist du online?'; formmsg.className='formmsg err'; }
  };

  dialogBody.querySelector('#wl_list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-wact]');
    if(!btn) return;
    const item = e.target.closest('.wl-item');
    const id = item.dataset.id;
    const w = wishlist.find(x=>x.id===id);
    if(!w) return;
    if(btn.dataset.wact === 'wdel'){
      try { const db = await claude.use('db'); await db.collection('wishlist').doc(id).delete(); item.remove(); } catch(e){}
    } else if(btn.dataset.wact === 'tocol'){
      try { const db = await claude.use('db'); await db.collection('wishlist').doc(id).delete(); } catch(e){}
      closeModal();
      openAddEditModal({artist:w.artist, title:w.title, year:null, genre:'', isMix:false, rating:0, note:'', cds:[[]]});
    }
  });
}
document.getElementById('m_wishlist').onclick = openWishlistModal;

/* ---------------- sticker ---------------- */
function stickerHtml(a){
  return '<div class="sticker-wrap">' +
    '<div class="shead"><div><div class="sartist">'+escapeHtml(a.artist)+(a.rating>=4?' ★':'')+'</div><div class="stitle">'+escapeHtml(a.title)+'</div></div>' +
    '<div class="smeta">'+[a.year,a.genre].filter(Boolean).map(escapeHtml).join(' · ')+'</div></div>' +
    '<div class="stracks">' +
    a.cds.map((cd,ci)=>{
      const label = a.cds.length>1 ? ('CD '+(ci+1)) : 'Titelliste';
      return '<div class="sdisc"><h5>'+label+'</h5>' + (cd||[]).map((t,i)=>(i+1)+'. '+escapeHtml(t)).join('<br>') + '</div>';
    }).join('') +
    '</div></div>';
}
/** Standalone, self-contained HTML for one sticker — no external fonts, no app chrome —
 * so it prints cleanly no matter where it's opened (Files-App-Vorschau, Safari, Mail-Anhang, ...). */
function stickerStandaloneHtml(a){
  const title = escapeHtml(a.artist) + ' - ' + escapeHtml(a.title);
  return '<!doctype html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>'+title+'</title><style>' +
    'body{margin:14px; font-family: ui-monospace, Menlo, "SF Mono", Consolas, monospace; color:#16150f;}' +
    '.sticker-wrap{border:2px solid #16150f; padding:10px 12px; max-width:520px;}' +
    '.shead{display:flex; justify-content:space-between; gap:10px; border-bottom:2px solid #16150f; padding-bottom:6px; margin-bottom:6px;}' +
    '.sartist{font-weight:700; font-size:16px;} .stitle{font-size:13px; color:#55524a; font-style:italic;}' +
    '.smeta{font-size:11px; color:#55524a; text-align:right; white-space:nowrap;}' +
    '.stracks{columns:2; column-gap:14px; font-size:12.5px; line-height:1.55;}' +
    '.sdisc{break-inside:avoid; margin-bottom:10px;} .sdisc h5{font-size:10.5px; text-transform:uppercase; color:#55524a; margin:0 0 4px 0;}' +
    '.printhint{margin-top:16px; font-size:11px; color:#77736a;}' +
    '@media print{ .printhint{display:none;} body{margin:0;} }' +
    '</style></head><body>' +
    stickerHtml(a) +
    '<div class="printhint">Zum Drucken: Teilen-Symbol → Drucken (oder Strg/Cmd+P).</div>' +
    '</body></html>';
}
async function exportStickerFile(a){
  try {
    const downloads = await claude.use('downloads');
    if(!downloads){ toast('Dafür brauchst du kurz Internet.', true); return; }
    const safeName = (a.artist+'-'+a.title).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'sticker';
    await downloads.save({filename: 'sticker-'+safeName+'.html', data: stickerStandaloneHtml(a)});
    toast('Datei gespeichert — öffne sie und drucke von dort über Teilen → Drucken.');
  } catch(e) {
    if(e && e.code !== 'declined') toast('Konnte die Datei nicht speichern (' + (e&&e.code||'Fehler') + ').', true);
  }
}
function openStickerModal(a){
  openModal('Sticker – Vorschau');
  dialogBody.innerHTML = stickerHtml(a) +
    '<div class="sticker-hint">"Drucken" versucht den Druckdialog direkt zu öffnen — klappt nur in einem echten Browser (z.B. Safari), nicht in der Claude-App-Ansicht. Öffnest du die App über das Home-Bildschirm-Symbol, nutze stattdessen "Als Datei speichern": die Datei kannst du danach in der Dateien-App öffnen und von dort ganz normal über Teilen → Drucken ausdrucken.</div>';
  dialogActions.innerHTML = '<button class="dbtn" id="stCloseBtn">Schließen</button><button class="dbtn" id="stExportBtn">Als Datei speichern</button><button class="dbtn primary" id="stPrintBtn">Drucken</button>';
  document.getElementById('stCloseBtn').onclick = closeModal;
  document.getElementById('stExportBtn').onclick = () => exportStickerFile(a);
  document.getElementById('stPrintBtn').onclick = () => {
    try { window.print(); } catch(e){ /* may be blocked here — the hint text and the export button cover that case */ }
  };
}
</script>
